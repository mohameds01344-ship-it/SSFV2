<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050505">

    <title>Product — SSF</title>

    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="product-page">


    <div class="announcement">

        <span
            data-ar="قوة في كل حركة — اكتشف مجموعة SSF الجديدة"
            data-en="STRENGTH IN EVERY MOVE — DISCOVER THE NEW SSF DROP">

            قوة في كل حركة — اكتشف مجموعة SSF الجديدة

        </span>

    </div>


    <header class="site-header">

        <a class="brand" href="index.html">

            <span class="brand-mark">SSF</span>
            <span class="brand-caption">SUPER STRENGTH FIT</span>

        </a>


        <nav class="main-nav">

            <a href="index.html#home" data-ar="الرئيسية" data-en="Home">
                الرئيسية
            </a>

            <a href="index.html#shop" data-ar="المتجر" data-en="Shop">
                المتجر
            </a>

            <a href="index.html#story" data-ar="عن SSF" data-en="Our Story">
                عن SSF
            </a>

        </nav>


        <div class="header-actions">

            <button class="lang-switch" id="languageToggle">
                EN
            </button>

            <a class="bag-link" href="index.html#shop">
                <span>↗</span>
                <span data-ar="المتجر" data-en="Shop">المتجر</span>
            </a>

        </div>

    </header>


    <main class="product-main">

        <a class="back-link" href="index.html#shop">

            ←

            <span data-ar="العودة للمتجر" data-en="BACK TO SHOP">
                العودة للمتجر
            </span>

        </a>


        <div class="product-layout">


            <!-- PRODUCT IMAGE -->

            <div class="product-gallery">

                <div class="main-product-image" id="mainProductImage"></div>

                <div class="gallery-note">
                    SSF / CORE COLLECTION
                </div>

            </div>


            <!-- PRODUCT DETAILS -->

            <div class="product-info">

                <p class="eyebrow">
                    <i></i>
                    <span id="productCategory"></span>
                </p>


                <h1 id="productName">
                    Product Name
                </h1>


                <div class="product-price" id="productPrice"></div>


                <p class="product-description" id="productDescription"></p>


                <!-- ORDER FORM -->

                <form id="orderForm" class="order-form">


                    <!-- SIZE -->

                    <div class="form-section">

                        <label data-ar="اختار المقاس" data-en="SELECT SIZE">
                            اختار المقاس
                        </label>

                        <div class="size-options" id="sizeOptions"></div>

                        <input type="hidden" id="selectedSize" required>

                    </div>


                    <!-- QUANTITY -->

                    <div class="form-section">

                        <label data-ar="الكمية" data-en="QUANTITY">
                            الكمية
                        </label>

                        <div class="quantity-control">

                            <button type="button" id="qtyMinus">
                                −
                            </button>

                            <input type="number" id="quantity" value="1" min="1" max="10" readonly>

                            <button type="button" id="qtyPlus">
                                +
                            </button>

                        </div>

                    </div>


                    <div class="form-divider"></div>


                    <h3 data-ar="بيانات التوصيل" data-en="DELIVERY DETAILS">
                        بيانات التوصيل
                    </h3>


                    <div class="form-grid">


                        <div class="field">

                            <label for="customerName" data-ar="الاسم بالكامل" data-en="FULL NAME">
                                الاسم بالكامل
                            </label>

                            <input
                                id="customerName"
                                type="text"
                                required
                                placeholder="الاسم">

                        </div>


                        <div class="field">

                            <label for="customerPhone" data-ar="رقم الموبايل" data-en="PHONE NUMBER">
                                رقم الموبايل
                            </label>

                            <input
                                id="customerPhone"
                                type="tel"
                                required
                                placeholder="01xxxxxxxxx">

                        </div>


                        <div class="field full">

                            <label for="governorate" data-ar="المحافظة" data-en="GOVERNORATE">
                                المحافظة
                            </label>

                            <select id="governorate" required>

                                <option value=""
                                    data-ar="اختار المحافظة"
                                    data-en="Select governorate">

                                    اختار المحافظة

                                </option>

                            </select>

                        </div>


                        <div class="field full">

                            <label for="address" data-ar="العنوان بالتفصيل" data-en="FULL ADDRESS">
                                العنوان بالتفصيل
                            </label>

                            <textarea
                                id="address"
                                rows="3"
                                required
                                placeholder="المنطقة، الشارع، رقم العقار..."></textarea>

                        </div>


                        <div class="field full">

                            <label for="notes"
                                data-ar="ملاحظات إضافية (اختياري)"
                                data-en="ORDER NOTES (OPTIONAL)">

                                ملاحظات إضافية (اختياري)

                            </label>

                            <input
                                id="notes"
                                placeholder="أي تفاصيل إضافية">

                        </div>

                    </div>


                    <!-- PRICE SUMMARY -->

                    <div class="order-summary">


                        <div>

                            <span data-ar="سعر المنتج" data-en="PRODUCT TOTAL">
                                سعر المنتج
                            </span>

                            <b id="summaryProduct"></b>

                        </div>


                        <div>

                            <span data-ar="الشحن" data-en="DELIVERY">
                                الشحن
                            </span>

                            <b id="summaryShipping"></b>

                        </div>


                        <div class="summary-total">

                            <span data-ar="الإجمالي" data-en="TOTAL">
                                الإجمالي
                            </span>

                            <b id="summaryTotal"></b>

                        </div>

                    </div>


                    <!-- SUBMIT -->

                    <button class="button order-submit" type="submit">

                        <span data-ar="تأكيد الطلب عبر واتساب"
                              data-en="CONFIRM ORDER VIA WHATSAPP">

                            تأكيد الطلب عبر واتساب

                        </span>

                        <b>↗</b>

                    </button>


                    <p class="form-hint"
                       data-ar="هتفتح رسالة واتساب جاهزة بكل تفاصيل طلبك."
                       data-en="WhatsApp will open with your order details ready to send.">

                        هتفتح رسالة واتساب جاهزة بكل تفاصيل طلبك.

                    </p>


                </form>

            </div>

        </div>

    </main>


    <footer>

        <div class="footer-bottom">

            <span>© 2026 SSF — SUPER STRENGTH FIT</span>

            <a href="index.html">
                SSF HOME ↗
            </a>

        </div>

    </footer>


    <script src="script.js"></script>
    <script src="product.js"></script>

</body>
</html>
